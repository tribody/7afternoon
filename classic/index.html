<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#5C4033">
    <title>我们的故事 · 七夕</title>
    <!--
      字体：这里原本是三个 Google Fonts 阻塞 link（preconnect ×2 + stylesheet ×1）。

      fonts.googleapis.com 在中国大陆不可达，且是**挂起**而不是快速失败：
      浏览器因此不渲染 body、不触发 load —— 而 game.js 的入口就写在
      window load 里，于是页面永远停在 loading 上，一动不动。

      实测（scripts/diag-mobile.mjs，微信 UA / 390×844@3x）：
        fonts 挂起   → 30s 内 load 从未触发，Game.init 从未执行
        fonts 失败   → 292ms load 完，3.9s 正常可玩

      现改为系统字体栈（style.css 两处 + game.js 的 FT/FB），零外网依赖。
    -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-envelope">
            <div class="envelope-body"></div>
            <div class="envelope-flap"></div>
            <div class="envelope-seal"></div>
        </div>
        <div class="loading-text">正在准备我们的故事...</div>
        <div class="loading-bar">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <!-- UI Overlay -->
    <div id="ui-overlay" class="ui-overlay" style="display:none;">
        <button id="music-btn" class="music-btn" aria-label="音乐开关">
            <span class="music-icon">&#9834;</span>
        </button>

        <div id="progress-dots" class="progress-dots"></div>

        <div id="scene-text" class="scene-text"></div>

        <div id="hint-text" class="hint-text"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
