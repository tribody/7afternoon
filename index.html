<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 这一页必须不缓存，否则改了开关线上不生效（X5 缓存极其激进） -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>我们的故事 · 七夕</title>
  <script>
    /*
     * ┌──────────────────────────────────────────────────────────┐
     * │  双轨开关 —— 回滚只需改下面这一行，push 后约 30 秒生效。  │
     * │                                                          │
     * │  './classic/'   原版（冻结基线，M4 前不动一个字节）      │
     * │  './v2/'        three.js 2.5D 重制版                     │
     * └──────────────────────────────────────────────────────────┘
     */
    var TARGET = './classic/';

    /*
     * 破缓存。微信 X5 对不带查询串的 HTML 缓存极其激进 —— 改了内容它照样把
     * 旧的塞给你，页面就永远停在修复前的状态。加一个静态版本号，让更新后的
     * 资源是个**新 URL**，浏览器必须重新取。
     *
     * ⚠️ 每次改动 classic/（或将来切到 v2）都要 bump 这个值，否则等于没改。
     *    对外观的副作用只有一个尾巴 `?v=...`，无害。
     */
    var BUILD = '20260925a';

    // 透传用户自己带的 query/hash
    var extra = location.search ? '&' + location.search.slice(1) : '';
    location.replace(TARGET + '?v=' + BUILD + extra + location.hash);
  </script>
</head>
<body>
  <noscript>
    <p style="font:16px/1.8 system-ui;padding:24px;text-align:center">
      <a href="./classic/">进入我们的故事</a>
    </p>
  </noscript>
</body>
</html>
