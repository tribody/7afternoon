<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 这一页必须不缓存，否则改了开关线上不生效（X5 缓存极其激进） -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>我们的故事 · 七夕</title>
  <script>
    /*
     * ┌──────────────────────────────────────────────────────────┐
     * │  双轨开关 —— 回滚只需改下面这一行，push 后约 30 秒生效。  │
     * │                                                          │
     * │  './classic/'   原版（冻结基线，M4 前不动一个字节）      │
     * │  './v2/'        three.js 2.5D 重制版                     │
     * └──────────────────────────────────────────────────────────┘
     */
    var TARGET = './classic/';

    // 透传 query/hash：入口 URL 会带 ?v=1.0.x 用于穿透微信缓存
    location.replace(TARGET + location.search + location.hash);
  </script>
</head>
<body>
  <noscript>
    <p style="font:16px/1.8 system-ui;padding:24px;text-align:center">
      <a href="./classic/">进入我们的故事</a>
    </p>
  </noscript>
</body>
</html>
